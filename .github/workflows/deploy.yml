name: Build and Publish Glance Services

on:
  push:
    branches:
      - main
    paths:
      - "glance/**"
      - "rsshub/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  test-rsshub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rsshub
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Test Bahamut BBS route parsing
        run: npm test

      - name: Test PTT board route parsing
        run: node test/ptt-board.test.js

  build:
    runs-on: ubuntu-latest
    needs: test-rsshub
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image names
        id: images
        shell: bash
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "glance_image=ghcr.io/${owner}/${repo}/glance:latest" >> "$GITHUB_OUTPUT"
          echo "rsshub_image=ghcr.io/${owner}/${repo}/rsshub:latest" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Glance image
        uses: docker/build-push-action@v6
        with:
          context: ./glance
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.images.outputs.glance_image }}

      - name: Build and push RSSHub image
        uses: docker/build-push-action@v6
        with:
          context: ./rsshub
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.images.outputs.rsshub_image }}
